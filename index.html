<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitSecureX Tech – We Build. We Automate. We Secure.</title>
    
    <!-- ✅ PRELOAD HERO IMAGE -->
    <link rel="preload" as="image" href="/bitsecurex_uiux.webp" fetchpriority="high" />
    
    <!-- ✅ PRECONNECT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- ✅ DEFER FONTS (Non-blocking) -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" 
      onload="this.onload=null;this.rel='stylesheet'" 
    />
    <noscript>
      <link 
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" 
        rel="stylesheet" 
      />
    </noscript>

    <!-- ✅ CRITICAL CSS -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0a0a1a;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      .container-x { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
      .gradient-text { background: linear-gradient(135deg, #00e676, #00b0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .btn-primary { 
        display: inline-flex; 
        align-items: center; 
        gap: 8px; 
        background: linear-gradient(135deg, #00e676, #00b0ff); 
        color: #0a0a1a; 
        font-weight: 600; 
        padding: 12px 24px; 
        border-radius: 12px; 
        border: none; 
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Inter', sans-serif;
      }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,230,118,0.3); }
    </style>

    <!-- ✅ META TAGS -->
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Web development, cybersecurity, AI automation, and cloud solutions for businesses worldwide." />
    <meta property="og:title" content="BitSecureX Tech" />
    <meta property="og:description" content="Web development, cybersecurity, AI automation, and cloud solutions for businesses worldwide." />
    <meta name="robots" content="index, follow" />
    
    <!-- ✅ SECURITY HEADERS (via meta) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
